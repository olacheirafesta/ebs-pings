name: InstaEventos · recuperação de checkouts (hora a hora)
on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint Vercel
        run: |
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --max-time 90 -X POST \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            https://ebs-webhooks.vercel.app/api/recupera-checkout
