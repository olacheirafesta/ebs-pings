name: CODE · sync + cancelamentos (diário 9h Lisboa)
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint Vercel
        run: |
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors --max-time 90 -X POST \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            https://ebs-webhooks.vercel.app/api/code-daily
      # O GitHub desativa crons em repos sem commits há 60 dias.
      # No dia 1 de cada mês, um commit mínimo mantém o relógio vivo.
      - name: Keepalive mensal
        if: ${{ always() }}
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ka
            cd ka
            date -u > .keepalive
            git config user.name "ebs-pings-bot"
            git config user.email "actions@github.com"
            git add .keepalive && git commit -m "keepalive mensal" && git push
          else
            echo "não é dia 1 — sem keepalive"
          fi
